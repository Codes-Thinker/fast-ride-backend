# Reference Nginx reverse-proxy config for the Fastride API.
# Copy to /etc/nginx/sites-available/fastride on the EC2 instance, then:
#   sudo ln -s /etc/nginx/sites-available/fastride /etc/nginx/sites-enabled/fastride
#   sudo nginx -t && sudo systemctl reload nginx
# Install the certificate with certbot before enabling this file (see DEPLOYMENT.md).

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
